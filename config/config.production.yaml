# Baseline NÃO-SECRETO do backend em produção. Montado em /app/config.yaml.
#
# Regra de ouro: tudo que é credencial ou hostname fica no .env (compose) —
# applyEnvOverrides (internal/config/config.go) sobrepõe este arquivo. Aqui
# vivem só os knobs que NÃO têm variável de ambiente equivalente.
#
# Os campos abaixo com valor de placeholder (senhas vazias, jwt_secret) são
# sempre substituídos pelo env; ficam aqui só porque o YAML precisa da chave.

server:
  port: 8081
  context_path: /api
  shutdown_timeout: 30s
  # Sobreposto por BRAINSENTRY_ENV=production no compose. Em production o boot
  # RECUSA jwt_secret default e demo_auth_enabled=true (fail-closed).
  environment: production

database:
  host: bluevix-postgres
  port: 5432
  name: brainsentry
  user: brainsentry
  password: ""      # ← DB_PASSWORD
  sslmode: disable  # ← DB_SSLMODE (pg compartilhado não tem TLS; rede docker)
  max_connections: 20
  min_connections: 5

redis:
  host: bluevix-redis
  port: 6379
  password: ""
  # IMPORTANTE: não existe env override para redis.db. O bluevix usa db 0 no
  # MESMO Redis — sem este isolamento as chaves colidiriam (rate-limit, cache
  # de embeddings, scheduler). Mudar aqui exige redeploy do backend.
  db: 3

falkordb:
  host: brainsentry-falkordb
  port: 6379
  password: ""
  graph_name: brainsentry

security:
  jwt_secret: ""    # ← JWT_SECRET (production recusa vazio/default)
  jwt_expiration: 24h
  bcrypt_cost: 12
  # Em production o Validate() recusa true. Explícito para não haver dúvida.
  demo_auth_enabled: false
  cors:
    # Sobreposto por CORS_ORIGINS. O SPA é same-origin (nginx faz proxy de
    # /api), então isto só importa para consumidores externos da API.
    allowed_origins:
      - "https://app.brainsentry.com.br"
    allowed_methods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]

tenant:
  default_id: "a9f814d2-4dae-41f3-851b-8aa3d4706561"

ai:
  provider: openrouter
  model: "anthropic/claude-haiku-4-5"   # ← AI_MODEL
  api_key: ""                            # ← BRAINSENTRY_AI_AGENTIC_MODEL_API_KEY
  base_url: "https://openrouter.ai/api/v1"
  temperature: 0.2
  max_tokens: 500
  timeout: 60s
  max_retries: 3

embedding:
  # ATENÇÃO — 1536 e não os 384 do dev. A migração 8 cria decisions.embedding e
  # events.embedding como vector(1536); com 384 todo INSERT nessas tabelas
  # falharia. O EmbeddingService gera vetores com ESTA dimensão (inclusive no
  # fallback hash), então 1536 mantém tudo consistente e já casa com
  # openai/text-embedding-3-small caso uma chave OpenAI seja plugada depois.
  #
  # Hoje ai.base_url aponta para o OpenRouter, que NÃO tem /embeddings: cada
  # Embed() faz uma chamada que falha e cai no fallback hash (busca semântica
  # degradada, ~1 round-trip desperdiçado). Para embeddings reais, aponte
  # ai.base_url para https://api.openai.com/v1 com uma chave OpenAI — mas note
  # que o mesmo par chave/base_url também serve o LLM de chat.
  model: "openai/text-embedding-3-small"
  dimensions: 1536

interception:
  quick_check_enabled: true
  deep_analysis_enabled: true
  relevance_threshold: 0.7

memory:
  auto_capture: true
  auto_importance: true
  obsolescence_days: 90

logging:
  level: info
  format: json
