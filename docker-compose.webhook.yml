# Receiver de CD (adnanh/webhook). Projeto compose ISOLADO de propósito:
#   docker compose -f docker-compose.webhook.yml --env-file .env up -d --build
# Roteado pelo Caddy compartilhado em deploy.${ROOT_DOMAIN} (sem abrir porta
# na VPS). O repo é bind-montado no MESMO path do host (/opt/brainsentry-devops)
# para que os bind-mounts relativos do compose principal resolvam no daemon.
name: brainsentry-webhook

services:
  webhook:
    build: ./webhook
    container_name: brainsentry-webhook
    restart: unless-stopped
    environment:
      DEPLOY_TOKEN: ${DEPLOY_TOKEN}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/brainsentry-devops:/opt/brainsentry-devops
      # Reusa o login GHCR do host (evita pôr GHCR_TOKEN no .env). As imagens
      # do brainsentry são públicas hoje, mas isto sobrevive a torná-las privadas.
      - /root/.docker/config.json:/root/.docker/config.json:ro
    networks:
      - web
    labels:
      # O Caddy compartilhado roteia via Caddyfile (não por labels); estas
      # labels são documentais. O bloco fica em caddy/brainsentry.caddy.
      - "com.brainsentry.role=cd-webhook"

networks:
  web:
    external: true
    name: bluevix_web
