# Endpoint: POST https://deploy.<ROOT_DOMAIN>/hooks/deploy
# Header:   X-Deploy-Token: <DEPLOY_TOKEN>
# Body JSON: { "component": "backend" | "frontend" | "all", "tag": "<image-tag>" }
#
# Exemplo (a partir do CI, depois que a imagem subiu no GHCR):
#   curl -fsS https://deploy.brainsentry.com.br/hooks/deploy \
#     -H "X-Deploy-Token: $DEPLOY_TOKEN" -H 'Content-Type: application/json' \
#     -d '{"component":"backend","tag":"sha-abc1234"}'
- id: deploy
  execute-command: /opt/brainsentry-devops/scripts/run-deploy.sh
  command-working-directory: /opt/brainsentry-devops
  pass-arguments-to-command:
    - source: string
      name: production
    - source: payload
      name: component
    - source: payload
      name: tag
  include-command-output-in-response: false
  response-message: "deploy dispatched"
  # Token inválido/ausente → 403 (em vez do 200 padrão do adnanh/webhook).
  trigger-rule-mismatch-http-response-code: 403
  trigger-rule:
    match:
      type: value
      value: '{{ getenv "DEPLOY_TOKEN" }}'
      parameter:
        source: header
        name: X-Deploy-Token
